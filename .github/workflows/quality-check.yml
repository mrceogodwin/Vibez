name: VIBEZ quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/vybz_ci
      AUTH_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYSTACK_SECRET_KEY: ""
      PAYSTACK_PUBLIC_KEY: ""
      VIBEZ_ADMIN_KEY: ci-only-admin-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
